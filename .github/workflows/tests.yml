name: tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: "3.11"
          - os: windows-2025
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: powershell
        run: ./scripts/run_tests.ps1
